name: Validación del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 · 150 pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar importaciones principales
        run: python -c "from src.dss.engine import recommend; from src.data.siar_client import SiARClient; print('Importaciones correctas')"

      - name: Ejecutar pruebas automáticas
        run: python -m unittest discover -s tests

      - name: Regenerar la validación multicaso
        run: python -m src.analysis.build_validation_multicase_5_3 --output-dir "${{ runner.temp }}/validation" --image-dir "${{ runner.temp }}/images"
