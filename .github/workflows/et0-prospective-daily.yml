name: Validación prospectiva ET0

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: et0-prospective-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SIAR_API_TOKEN: ${{ secrets.SIAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias mínimas
        run: python -m pip install pandas==3.0.6 numpy==2.5.3 scikit-learn==1.9.1 joblib==1.6.0 requests python-dotenv
      - name: Recuperar el registro prospectivo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin codex/et0-prospectivo >/dev/null; then
            git fetch origin codex/et0-prospectivo
            git switch -c codex/et0-prospectivo --track origin/codex/et0-prospectivo
            git merge --no-edit origin/main
          else
            git switch -c codex/et0-prospectivo
          fi
      - name: Emitir y revisar predicciones ET0
        run: python -m src.analysis.run_et0_prospective_daily
      - name: Publicar evidencia sin credenciales
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/data_samples/et0_prospective_ledger.csv \
            docs/data_samples/et0_prospective_validation_latest.json \
            docs/data_samples/et0_prospective_daily_latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualizar validación prospectiva ET0'
          git push origin codex/et0-prospectivo
          if [ "$(gh pr list --head codex/et0-prospectivo --base main --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head codex/et0-prospectivo \
              --title 'Actualizar validación prospectiva ET0' \
              --body 'Emisiones automáticas h=1…9 en AL01, Z06 y BA08; revisión de valores provisionales y consolidados.'
          fi
